<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Local Desactivada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #050507;
    background-image: 
      radial-gradient(ellipse 70% 35% at 50% -10%, rgba(56, 189, 248, 0.07), transparent 75%),
      radial-gradient(circle at 100% 100%, rgba(147, 51, 234, 0.03), transparent 40%);
    background-attachment: fixed;
    color: #f4f4f5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .box {
    background: #0d0d10;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 12px;
    padding: 42px 32px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #f4f4f5;
    letter-spacing: -0.02em;
    margin: 0 0 14px 0;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #a1a1aa;
    margin: 0 0 24px 0;
  }
  .status {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #f87171;
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.2);
    padding: 6px 14px;
    border-radius: 9999px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>RED LOCAL DESACTIVADA</h1>
    <p>El acceso remoto a este servidor ha sido cortado. Para volver a conectarte, actívalo en el panel desde la PC principal.</p>
    <span class="status">ACCESO RESTRINGIDO</span>
  </div>
</body>
</html>
