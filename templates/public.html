<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Llama • Servidor Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050507;
    --surface-1: #0d0d10;
    --surface-2: #141417;
    --border-subtle: rgba(255, 255, 255, 0.07);
    --border-hover: rgba(255, 255, 255, 0.16);
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.15);
    --emerald: #10b981;
    --danger: #f87171;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(ellipse 70% 35% at 50% -10%, rgba(56, 189, 248, 0.07), transparent 75%),
      radial-gradient(circle at 100% 100%, rgba(147, 51, 234, 0.03), transparent 40%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrapper {
    max-width: 540px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 8px;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .header p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .api-box {
    display: flex;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px 14px;
    gap: 12px;
  }

  .api-url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    flex-grow: 1;
    overflow-x: auto;
    white-space: nowrap;
  }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-copy:hover {
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .btn-chat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: var(--accent);
    text-decoration: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s ease;
  }

  .btn-chat:hover {
    background: rgba(56, 189, 248, 0.22);
    border-color: var(--accent);
  }

  /* Botón de Detención de Inferencia Personal (Sin emojis, SVG puro) */
  .btn-stop-mine {
    background: rgba(245, 158, 11, 0.08);
    color: #f59e0b;
    border: 1px solid rgba(245, 158, 11, 0.25);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .btn-stop-mine:hover {
    background: rgba(245, 158, 11, 0.18);
    border-color: #fbbf24;
    color: #fbbf24;
  }

  .btn-stop-mine svg {
    flex-shrink: 0;
  }

  .toast-popup {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #141417;
    border: 1px solid var(--border-hover);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    z-index: 999;
    transition: opacity 0.2s ease;
  }

  .model-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-active {
    background: var(--emerald);
    box-shadow: 0 0 10px var(--emerald);
  }

  .dot-idle {
    background: var(--text-muted);
  }

  .badges-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .model-badge {
    background: var(--surface-2);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .form-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .input-pin {
    flex-grow: 1;
    background: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .input-pin:focus {
    border-color: var(--accent);
  }

  .btn-submit {
    background: var(--surface-2);
    border: 1px solid var(--border-hover);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-submit:hover {
    background: var(--text-primary);
    color: var(--bg-base);
  }

  .err-msg {
    margin-top: 10px;
    color: var(--danger);
    font-size: 13px;
  }

  .muted-text {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Simple Llama</h1>
      <p>Servidor de IA local activo. Conéctate desde Zed, OpenCode o cualquier cliente OpenAI.</p>
    </div>

    <div class="card">
      <div class="card-title">Punto de enlace de la API (Endpoint)</div>
      <div class="api-box">
        <span class="api-url" id="apiUrl">http://{{IP}}:{{PORT}}/v1</span>
        <button type="button" class="btn-copy" onclick="copyApiUrl()">Copiar</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Modelo en uso</div>
      <div class="model-status">
        <span class="dot {{DOT_CLASS}}"></span>
        <span>{{ACTIVE_MODEL}}</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;">
        {{CHAT_BUTTON}}
        {{STOP_BUTTON}}
      </div>

      <div class="card-title" style="margin-top: 18px;">Modelos disponibles</div>
      <div class="badges-list">
        {{MODELS_BADGES}}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Administración</div>
      {{ADMIN_SECTION}}
    </div>
  </div>

  <div id="publicToast" class="toast-popup" style="display:none;"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('publicToast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    function copyApiUrl() {
      const url = document.getElementById('apiUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.textContent = 'Copiado';
        setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
      });
    }

    function stopMyInference() {
      fetch('/api/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ all: false })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showToast(data.stopped > 0 ? '✓ Inferencia detenida con éxito' : 'No tienes inferencias activas en curso');
        } else {
          showToast(data.error || 'Error al detener inferencia');
        }
      })
      .catch(() => showToast('Error al conectar con el servidor'));
    }
  </script>
</body>
</html>
